<!doctype html><html lang="zh-CN" data-theme="nasa"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>BOOTH 账户与资料库</title><script>function setTheme(theme){document.documentElement.dataset.theme=['nasa','swiss','x'].includes(theme)?theme:'nasa'}setTheme(window.boothWorkspace?.initialTheme);</script><link rel="stylesheet" href="window-themes.css"></head><body class="booth"><header><div class="line"><h1 id="title">BOOTH 账户与资料库</h1><span class="url" id="url"></span></div><nav><button data-tab="login">登录</button><button data-tab="favorites">♡ 我喜欢的</button><button data-tab="gifts">Gift</button><button data-tab="library">资料库</button><span id="session">登录状态保存在本机</span></nav><form id="search-form"><input id="query" type="search" maxlength="300" autocomplete="off" aria-label="BOOTH 商品搜索" placeholder="搜索 BOOTH · 商品名称、编号或商品网址"><button type="submit">搜索 BOOTH</button><button id="apply" type="button" disabled>应用此商品</button></form><div class="line"><button id="back" title="上一页">←</button><button id="forward" title="下一页">→</button><button id="reload">重载</button><span id="status">正在准备页面…</span><button id="close">关闭</button></div></header><script>
const api=window.boothWorkspace;let priorQuery;
function render(state){if(!state)return;setTheme(state.theme);document.getElementById('title').textContent=state.title;document.getElementById('url').textContent=state.url;document.getElementById('url').title=state.url;document.getElementById('status').textContent=state.status;document.getElementById('back').disabled=!state.canGoBack;document.getElementById('forward').disabled=!state.canGoForward;document.getElementById('apply').disabled=!state.canApply;document.getElementById('apply').textContent=state.applied?'已应用此商品':'应用此商品';document.body.classList.toggle('loading',state.loading);document.getElementById('session').textContent=(state.sessionSaved?'本机保存登录状态':'登录状态仅限当前会话')+(state.activeDownloads?' · '+state.activeDownloads+' 个下载中':'')+(!state.downloadDir?' · 请先在素材库选择下载位置':'');for(const button of document.querySelectorAll('[data-tab]'))button.classList.toggle('active',button.dataset.tab===state.tab);if(state.query!==priorQuery){document.getElementById('query').value=state.query;priorQuery=state.query}}
const run=promise=>Promise.resolve(promise).then(render).catch(error=>{document.getElementById('status').textContent=error.message||'操作失败';});for(const action of ['back','forward','reload','apply','close'])document.getElementById(action).addEventListener('click',()=>run(api[action]()));for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>run(api.tab(button.dataset.tab)));document.getElementById('search-form').addEventListener('submit',event=>{event.preventDefault();run(api.search(document.getElementById('query').value))});api.onState(render);api.state().then(render);document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();api.close()}if(event.key==='F5'||event.ctrlKey&&event.key.toLowerCase()==='r'){event.preventDefault();run(api.reload())}if(event.ctrlKey&&event.key.toLowerCase()==='l'){event.preventDefault();document.getElementById('query').focus();document.getElementById('query').select()}});
</script></body></html>
