<!DOCTYPE html><html lang="zh-CN" data-theme="nasa"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title data-i18n="商品预览">商品预览</title><script>function setTheme(theme){document.documentElement.dataset.theme=['nasa','swiss','x','x-light'].includes(theme)?theme:'nasa'}setTheme(window.productPreview?.initialTheme);</script><script>document.documentElement.lang=['zh-CN','ja','en'].includes(window.productPreview?.initialLanguage)?window.productPreview.initialLanguage:'zh-CN';</script><link rel="stylesheet" href="window-themes.css"></head><body class="preview"><header><h1 id="title">商品预览</h1><div id="url"></div><nav><button id="back" title="上一页" data-i18n-title="上一页" data-i18n="← 后退">← 后退</button><button id="forward" title="下一页" data-i18n-title="下一页" data-i18n="前进 →">前进 →</button><button id="reload" data-i18n="重载">重载</button><span id="status">正在准备预览…</span><button id="confirm" disabled="" data-i18n="确认这一商品">确认这一商品</button><button id="close" data-i18n="关闭">关闭</button></nav></header><script src="local-i18n.js"></script><script>
const api=window.productPreview;
function render(state){if(!state)return;setTheme(state.theme);localChrome.update(state.language,state.messages);document.getElementById('title').textContent=state.title;document.getElementById('url').textContent=state.url;document.getElementById('url').title=state.url;document.getElementById('status').textContent=state.status;document.getElementById('back').disabled=!state.canGoBack;document.getElementById('forward').disabled=!state.canGoForward;document.getElementById('confirm').disabled=!state.canConfirm;document.getElementById('confirm').textContent=localChrome.text(state.confirmed?'已确认':'确认这一商品');document.body.classList.toggle('loading',state.loading);}
for(const action of ['back','forward','reload','confirm','close'])document.getElementById(action).addEventListener('click',()=>Promise.resolve(api[action]()).then(render).catch(error=>{document.getElementById('status').textContent=localChrome.text(error.message||'操作失败');}));
api.onState(render);api.state().then(render);document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();api.close();}if(event.key==='F5'||event.ctrlKey&&event.key.toLowerCase()==='r'){event.preventDefault();api.reload().then(render);}});
</script>
</body></html>
