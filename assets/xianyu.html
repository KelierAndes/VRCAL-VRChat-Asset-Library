<!doctype html>
<html lang="zh-CN" data-theme="x"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'"><title>闲鱼尝试补全</title><link rel="stylesheet" href="xianyu.css"><script src="local-i18n.js"></script><script>document.documentElement.dataset.theme=window.xianyuWorkspace?.initialTheme||"x"</script></head>
<body><header id="chrome"><div class="title-row"><h1 data-i18n="闲鱼尝试补全">闲鱼尝试补全</h1><button id="close" type="button" data-i18n="关闭">关闭</button></div><p class="binding"><span data-i18n="当前绑定素材：">当前绑定素材：</span><strong id="title"></strong></p><p class="usage-reminder" role="note"><strong data-i18n="仅用于辅助搜索，不可用于购买。">仅用于辅助搜索，不可用于购买。</strong><span data-i18n="搜索结果只作线索，请核对商品与原作者授权。">搜索结果只作线索，请核对商品与原作者授权。</span></p><form id="search-form" class="search-row"><input id="query" maxlength="300" aria-label="闲鱼搜索关键词" data-i18n-aria-label="闲鱼搜索关键词" autocomplete="off"><button id="searchXianyu" type="submit" class="primary" data-online data-i18n="搜索闲鱼">搜索闲鱼</button></form><div id="web-actions"><button id="local" type="button" data-i18n="图片与名称工具">图片与名称工具</button><button id="reload" type="button" data-online data-i18n="重载官网">重载官网</button><button id="applyMarketplace" type="button" data-online class="primary" data-i18n="应用此商品">应用此商品</button><label id="item-title-label"><span data-i18n="商品名称（网页未能读取时手动填写）">商品名称（网页未能读取时手动填写）</span><input id="item-title" maxlength="500" autocomplete="off" data-i18n-aria-label="已核对的闲鱼商品名称" aria-label="已核对的闲鱼商品名称"></label><span id="url"></span></div><p id="status" role="status"></p></header>
<main id="assistant"><p class="notice" data-i18n="进入商品详情后可尝试读取公开标题和封面；失败时保留已有资料，也可粘贴链接手动补全。">进入商品详情后可尝试读取公开标题和封面；失败时保留已有资料，也可粘贴链接手动补全。</p><div class="columns"><section class="panel"><h2 data-i18n="图片搜索辅助">图片搜索辅助</h2><div id="preview-box"><img id="preview" alt="本机预览" data-i18n-alt="本机预览" hidden><p id="empty" data-i18n="选择当前封面、本地图片，或粘贴剪贴板图片">选择当前封面、本地图片，或粘贴剪贴板图片</p></div><p id="image-label" class="muted"></p><div class="actions"><button id="currentCover" type="button" data-i18n="使用当前封面">使用当前封面</button><button id="choose" type="button" data-i18n="选择图片">选择图片</button><button id="paste" type="button" data-i18n="粘贴图片">粘贴图片</button></div><button id="save" type="button" disabled data-i18n="保存图片副本…">保存图片副本…</button><p class="muted" data-i18n="网页图搜不可用时，保存图片后在手机闲鱼 App 手动搜图。图片不会自动上传。">网页图搜不可用时，保存图片后在手机闲鱼 App 手动搜图。图片不会自动上传。</p></section><section class="panel"><h2 data-i18n="名称与 BOOTH 核对">名称与 BOOTH 核对</h2><label for="result" data-i18n="粘贴闲鱼结果标题或链接">粘贴闲鱼结果标题或链接</label><textarea id="result" rows="3" maxlength="8000"></textarea><button id="extract" type="button" data-i18n="整理为名称草稿">整理为名称草稿</button><button id="searchBooth" type="button" data-online data-i18n="用这个名称搜 BOOTH">用这个名称搜 BOOTH</button><p class="muted" data-i18n="闲鱼商品编号不会当作 BOOTH 编号；来源确认支持撤回。">闲鱼商品编号不会当作 BOOTH 编号；来源确认支持撤回。</p><button id="openOfficial" type="button" data-online data-i18n="打开闲鱼官网，仅浏览">打开闲鱼官网，仅浏览</button><p id="offline" class="offline" data-i18n="联网已关闭，仍可整理本机图片与名称。" hidden>联网已关闭，仍可整理本机图片与名称。</p></section></div></main>
<script>
const api=window.xianyuWorkspace,$=id=>document.getElementById(id);let state,lastImage='',lastItem='';const text=s=>window.localChrome.text(s);
function measure(){if(state?.officialVisible)api.layout($('chrome').getBoundingClientRect().height).catch(()=>{})}
function render(next){if(!next)return;state=next;const item=next.canApply?next.url:'';if(item!==lastItem){$('item-title').value='';lastItem=item;}$('item-title-label').hidden=!next.canApply;document.documentElement.dataset.theme=['x','x-light','nasa','swiss'].includes(next.theme)?next.theme:'x';window.localChrome.update(next.language,next.messages);$('title').textContent=next.title;$('status').textContent=next.status;$('url').textContent=next.url;$('assistant').hidden=next.officialVisible;document.body.classList.toggle('web',next.officialVisible);$('offline').hidden=next.online;for(const b of document.querySelectorAll('[data-online]'))b.disabled=!next.online||next.busy;$('applyMarketplace').disabled=!next.online||next.busy||!next.canApply;for(const id of ['choose','paste','currentCover','extract'])$(id).disabled=next.busy;$('save').disabled=!next.image||next.busy;const image=next.image?.dataUrl||'';if(image!==lastImage){lastImage=image;if(image)$('preview').src=image;else $('preview').removeAttribute('src')}$('preview').hidden=!image;$('empty').hidden=!!image;$('image-label').textContent=next.image?next.image.width+' × '+next.image.height+' · '+text('本机预览'):'';if(document.activeElement!==$('query'))$('query').value=next.draft||'';if(document.activeElement!==$('result'))$('result').value=next.result||'';requestAnimationFrame(measure)}
function run(p){return Promise.resolve(p).then(render).catch(e=>{$('status').textContent=e.message||text('操作未完成，请重试。');requestAnimationFrame(measure)})}
for(const id of ['close','choose','paste','save','currentCover','openOfficial','local','reload'])$(id).onclick=()=>run(api[id]());$('applyMarketplace').onclick=()=>run(api.applyMarketplace($('item-title').value));$('search-form').onsubmit=e=>{e.preventDefault();run(api.searchXianyu($('query').value))};$('searchBooth').onclick=()=>run(api.searchBooth($('query').value));$('extract').onclick=()=>run(api.extract($('result').value));$('result').oninput=()=>api.result($('result').value).catch(()=>{});$('query').oninput=()=>api.draft($('query').value).catch(()=>{});new ResizeObserver(measure).observe($('chrome'));api.onState(render);run(api.state());document.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();state?.officialVisible?run(api.local()):run(api.close())}};
</script></body></html>
